name: ci

# Gates pull requests — including the automated data-refresh ones — with the
# full check, browser verification included. Pushes to main are covered by the
# pages workflow instead, so the two do not duplicate each other's work on
# every commit.

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Validates the MapLibre style, the search index and the routing graph.
      # An invalid style renders as a page that silently never loads, so this
      # is the check that matters most before a deploy.
      - name: Smoke test
        run: npm run build:data && npm run smoke

      - name: Build
        run: npm run build

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      # The only check that catches "the page loads but the map never appears".
      - name: Verify in a real browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npx vite preview --port 5180 &
          npx wait-on -t 30000 http://localhost:5180/
          npm run verify

      - name: Check the payload actually has data in it
        run: |
          node -e '
            const c = require("./dist/data/campus.json");
            const fail = (m) => { console.error("FAIL: " + m); process.exit(1) };
            if (!c.meta.bbox) fail("no campus bbox — the map would open unframed");
            console.log(`ok: ${c.pois.length} places`);
          '

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
