<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>iiest shibpur — campus map &amp; search</title>
<meta name="description" content="A map of IIEST Shibpur drawn from OpenStreetMap, with aerial imagery, walking and cycling routes, and every place put on by hand.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0d10'/><path d='M8 22 L16 9 L24 22' stroke='%2361d47c' stroke-width='2.5' fill='none' stroke-linejoin='round'/><circle cx='16' cy='23' r='2' fill='%23ffb454'/></svg>">
<script>
  // Set the theme before first paint so there is no flash of the wrong one.
  try {
    var t = localStorage.getItem('campusmap.theme')
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
  } catch (e) {}
</script>
</head>
<body>
  <div id="map" aria-label="Campus map"></div>

  <header id="bar">
    <button id="brand-btn" type="button" title="About &amp; data sources">iiest<span> shibpur</span></button>
    <button id="open-search" type="button" aria-label="Search campus">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M10.5 10.5 L14.2 14.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span class="ph">Search places, layers, commands…</span>
      <kbd>⌘K</kbd>
    </button>
    <button id="imagery-btn" type="button" aria-pressed="false"
            aria-label="Toggle aerial imagery" title="Aerial imagery off">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <rect x="1.6" y="2.6" width="12.8" height="10.8" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M1.6 10.6 L5.4 7.2 L8.6 10 L11 8.2 L14.4 11.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <circle cx="10.6" cy="5.6" r="1.3" fill="currentColor"/>
      </svg>
    </button>
    <button id="tag-btn" type="button" aria-pressed="false"
            aria-label="Tag a missing place" title="Add missing places">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path d="M8 1.8 C5.5 1.8 3.6 3.7 3.6 6.1 C3.6 9.2 8 14.2 8 14.2 C8 14.2 12.4 9.2 12.4 6.1 C12.4 3.7 10.5 1.8 8 1.8 Z"
              fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M8 4.4 V7.8 M6.3 6.1 H9.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span class="n"></span>
    </button>
    <button id="layers-btn" type="button" aria-expanded="false" aria-controls="layers">
      <span class="dots" aria-hidden="true"></span>
      <span class="n"></span>
    </button>
    <button id="theme-btn" type="button" aria-label="Change theme" title="Theme"></button>
  </header>

  <!-- One stack, so the chips can wrap to any number of rows without ever
       colliding with the footer below them. -->
  <div id="dock">
    <nav id="layers" aria-label="Map layers">
      <div class="layers-head">
        <span class="t">Layers</span>
        <button type="button" data-all>All</button>
        <button type="button" data-none>None</button>
        <button type="button" class="layers-close" aria-label="Close layers">&times;</button>
      </div>
      <div id="layer-chips"></div>
    </nav>
    <footer id="foot">
      <a href="https://www.openstreetmap.org/way/52097578" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M8 1.6 A 9 9 0 0 1 8 14.4 A 9 9 0 0 1 8 1.6 M1.6 8 H14.4" fill="none" stroke="currentColor" stroke-width="1.1"/>
        </svg>
        <span>improve this map on OSM</span>
      </a>
    </footer>
  </div>

  <div id="attrib">
    <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
    <span id="imagery-credit" hidden></span>
  </div>

  <section id="panel" hidden aria-live="polite"></section>

  <div id="palette" hidden role="dialog" aria-modal="true" aria-label="Search campus">
    <div id="palette-box">
      <div id="palette-input-row">
        <span id="palette-glyph" aria-hidden="true">›</span>
        <input id="palette-input" type="text" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" enterkeyhint="go"
               placeholder="search a place · tag mode · satellite · my tags …"
               aria-label="Search campus" aria-controls="palette-results" aria-expanded="true">
        <span id="palette-timing" aria-hidden="true"></span>
        <button id="palette-close" type="button" aria-label="Close search">&times;</button>
      </div>
      <div id="palette-results" role="listbox"></div>
      <footer id="palette-foot">
        <span class="hint"><kbd>↑↓</kbd> move</span>
        <span class="hint"><kbd>↵</kbd> open</span>
        <span class="hint"><kbd>tab</kbd> route</span>
        <a id="palette-repo" href="https://www.openstreetmap.org/way/52097578" target="_blank" rel="noopener">contribute</a>
        <span id="palette-count"></span>
      </footer>
    </div>
  </div>

  <div id="boot">loading campus…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
